name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Run get-composer-symfony script
        run: |
          chmod +x ./get-composer-symfony.sh
          ./get-composer-symfony.sh
          chmod +x ./bin/*

      - name: Deploy ./bin/ to FTP folder
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_HOST }}
          username: ${{ vars.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./bin/
          server-dir: ${{ vars.FTP_FOLDER }}/

