name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Run get-composer-symfony script
        run: |
          chmod +x ./get-composer-symfony.sh
          ./get-composer-symfony.sh
          chmod +x ./bin/*

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload ./bin/ via FTP and enforce executable flags
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_FOLDER: ${{ vars.FTP_FOLDER }}
        run: |
          lftp -u "${FTP_USER},${FTP_PASSWORD}" "${FTP_HOST}" <<EOF
          set cmd:fail-exit yes
          mkdir -p "${FTP_FOLDER}"
          cd "${FTP_FOLDER}"
          mirror -R --delete --verbose ./bin/ .
          chmod 755 composer
          chmod 755 symfony
          bye
          EOF

